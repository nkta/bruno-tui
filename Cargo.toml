[package]
name = "bruno-tui"
version = "0.1.0"
edition = "2024"
description = "TUI pour explorer et exécuter des collections Bruno (.bru) via le CLI bru"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nkta/bruno-tui"
homepage = "https://github.com/nkta/bruno-tui"
readme = "README.md"
keywords = ["bruno", "tui", "api", "http", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = [".agents/", ".claude/", "openspec/", "exempleTui/", "scripts/", "CLAUDE.md"]

[dependencies]
arboard = { version = "3.6.1", default-features = false }
jaq-core = "3.1.1"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
thiserror = "2.0.20"
notify = "8.2.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "sync", "io-util", "time"] }
time = { version = "0.3.55", default-features = false, features = ["std", "local-offset"] }

[target.'cfg(unix)'.dependencies]
command-fds = { version = "0.3.3", features = ["tokio"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
