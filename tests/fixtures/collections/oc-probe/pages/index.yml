info:
  name: index
  type: http
  seq: 1
  tags:
    - pages

http:
  method: GET
  url: "{{baseUrl}}/index.html"
  headers:
    - name: X-Trace
      value: abc
  params:
    - name: lang
      value: fr
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/index.html"
      method: GET
      headers:
        - name: X-Trace
          value: abc
      params:
        - name: lang
          value: fr
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
